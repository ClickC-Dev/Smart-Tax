<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>doc-page:not(:defined){visibility:hidden}
body{margin:0;font-family:var(--font-body)}
#root{display:flex;width:1200px;height:760px;overflow:hidden;background:var(--surface-page)}
a{color:var(--text-link)}a:hover{color:var(--navy-800)}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
*{animation-delay:-99s!important;animation-duration:.001s!important;animation-iteration-count:1!important;animation-fill-mode:both!important;animation-play-state:running!important;transition-duration:0s!important}
</style>
<script src="./doc-page.js"></script>
</head><body>
<doc-page size="letter" orientation="landscape" content-width="1200px" content-height="760px">
<div id="root"></div>
</doc-page>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="DocsScreen.jsx"></script>
<script type="text/babel" src="DeclaracoesScreen.jsx"></script>
<script type="text/babel" src="ConfigScreen.jsx"></script>
<script type="text/babel">
function App(){
  const nav = 'home';
  React.useEffect(()=>{ lucide.createIcons(); });
  const titles = { home:['Início','Visão geral da sua empresa'] };
  return (<>
    <window.Sidebar active={nav} onNav={()=>{}} />
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'auto'}}>
      <window.TopBar title={titles[nav][0]} subtitle={titles[nav][1]} />
      <window.HomeScreen/>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
