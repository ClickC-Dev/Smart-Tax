<!-- @dsCard group="Colors" viewport="700x120" name="Semantic status" subtitle="Success, warning, danger, info" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;font-family:var(--font-body)}#root{display:flex;gap:10px;padding:14px;height:92px;box-sizing:border-box}.sw{flex:1;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-size:12px;font-weight:600}</style></head>
<body><div id="root">
<div class="sw" style="background:var(--success-100);color:var(--success-500)">Sucesso</div>
<div class="sw" style="background:var(--warning-100);color:var(--warning-500)">Atenção</div>
<div class="sw" style="background:var(--danger-100);color:var(--danger-500)">Erro</div>
<div class="sw" style="background:var(--info-100);color:var(--info-500)">Info</div>
</div></body></html>
